name: Component CHECK boundaries
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./cmd/... ./internal/... -count=1 -timeout=2m
      # Compile the native SDK fixture; execution requires the isolated KVM host.
      - run: go -C lab test ./... -count=1
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go -C lab build -o "$RUNNER_TEMP/prefix-runtime.exe" ./cmd/prefix-runtime
  k0s-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 sources/k0s
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -v -run '^TestK0sSourceBundleReconstructsExactCommit$' .
        env:
          INTEGRATION_K0S_BASE_SOURCE: ${{ github.workspace }}/sources/k0s
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 sources/calico sources/containerd
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -v -timeout=22m .
        env:
          INTEGRATION_COMPONENT_TESTS: '1'
